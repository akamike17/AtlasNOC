version: '3.8'

services:
  # ─── Application ────────────────────────────────────────────────────────────
  atlasnoc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlasnoc-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=atlasnoc;User=atlasnoc;Password=${MYSQL_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD},abortConnect=False,connectTimeout=5000,syncTimeout=5000
      - AtlasNoc__RequireHttps=false
      - AtlasNoc__ApplyMigrationsOnStartup=true
      - DataProtection__CertificatePath=/run/secrets/atlasnoc-dataprotection.pfx
      - DataProtection__CertificatePassword=${DATA_PROTECTION_CERTIFICATE_PASSWORD}
      - ForwardedHeaders__KnownProxies__0=172.28.0.10
      - Serilog__MinimumLevel__Default=Information
      - Serilog__WriteTo__Seq__ServerUrl=http://seq:5341
      - OpenTelemetry__Endpoint=http://otel-collector:4317
      - Cors__AllowedOrigins__0=${CORS_ORIGIN_1}
      - Cors__AllowedOrigins__1=${CORS_ORIGIN_2}
    volumes:
      - ${DATA_PROTECTION_CERTIFICATE_PATH}:/run/secrets/atlasnoc-dataprotection.pfx:ro
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atlasnoc-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ─── MySQL Database ────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: atlasnoc-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=atlasnoc
      - MYSQL_USER=atlasnoc
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - atlasnoc-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ─── Redis Cache ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: atlasnoc-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    networks:
      - atlasnoc-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ─── OpenTelemetry Collector ───────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.0
    container_name: atlasnoc-otel
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "8888"
    networks:
      - atlasnoc-network

  # ─── Seq Log Server ────────────────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: atlasnoc-seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_API_CANONICALURI=http://seq:5341
    volumes:
      - seq-data:/data
    expose:
      - "80"
    networks:
      - atlasnoc-network

  # ─── Nginx Reverse Proxy (Production) ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: atlasnoc-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - atlasnoc
    networks:
      atlasnoc-network:
        ipv4_address: 172.28.0.10

networks:
  atlasnoc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mysql-data:
  redis-data:
  seq-data:
