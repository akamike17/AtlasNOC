name: AtlasNOC Overnight Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  security-events: write

concurrency:
  group: atlasnoc-overnight-audit
  cancel-in-progress: false

env:
  BASELINE_SHA: 8f3838daa94e6965c4306305e76512daa95f5299
  AUDIT_BRANCH: audit-night-8f3838d

jobs:
  deterministic-audit:
    name: Deterministic full audit
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_BRANCH }}
          fetch-depth: 0

      - name: Verify baseline lineage
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASELINE_SHA}^{commit}"
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
          echo "Baseline $BASELINE_SHA is an ancestor of $(git rev-parse HEAD)."

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Capture environment
        shell: bash
        run: |
          mkdir -p audit-output
          {
            echo "# AtlasNOC automated overnight audit"
            echo
            echo "Baseline: $BASELINE_SHA"
            echo "Audit branch: $AUDIT_BRANCH"
            echo "Audited SHA: $(git rev-parse HEAD)"
            echo "Run: $GITHUB_RUN_ID / attempt $GITHUB_RUN_ATTEMPT"
            echo "UTC: $(date -u --iso-8601=seconds)"
            echo
            echo "## dotnet --info"
            echo '```'
            dotnet --info
            echo '```'
          } > audit-output/AUTOMATED_AUDIT.md

      - name: Restore
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet restore AtlasNOC.slnx 2>&1 | tee audit-output/restore.log

      - name: Verify formatting
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet format AtlasNOC.slnx --no-restore --verify-no-changes 2>&1 | tee audit-output/format.log

      - name: Release build with warnings as errors
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet build AtlasNOC.slnx --no-restore -c Release -warnaserror 2>&1 | tee audit-output/build.log

      - name: Full test suite
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet test AtlasNOC.slnx -c Release --logger "trx;LogFileName=atlasnoc-night.trx" --results-directory audit-output/test-results 2>&1 | tee audit-output/tests.log

      - name: Flake and regression repeat
        id: repeat
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          for i in 1 2 3; do
            echo "=== regression pass $i ===" | tee -a audit-output/repeat-tests.log
            dotnet test AtlasNOC.slnx -c Release --logger "console;verbosity=minimal" 2>&1 | tee -a audit-output/repeat-tests.log || rc=1
          done
          exit $rc

      - name: NuGet vulnerability inventory
        id: nuget_vuln
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet list AtlasNOC.csproj package --vulnerable --include-transitive 2>&1 | tee audit-output/nuget-vulnerabilities.log

      - name: NuGet outdated inventory
        id: nuget_outdated
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet list AtlasNOC.csproj package --outdated --include-transitive 2>&1 | tee audit-output/nuget-outdated.log

      - name: Trivy filesystem scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: audit-output/trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: always() && hashFiles('audit-output/trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: audit-output/trivy.sarif

      - name: Scan tracked filenames for obvious secret mistakes
        if: always()
        shell: bash
        run: |
          {
            echo "Tracked files with names that deserve manual review:"
            git ls-files | grep -Ei '(^|/)(\.env($|\.)|.*secret.*|.*credential.*|.*password.*|.*private.*key.*|id_rsa|.*\.pfx$|.*\.p12$|.*\.pem$)' || true
          } > audit-output/suspicious-filenames.log

      - name: Record step outcomes
        if: always()
        shell: bash
        env:
          RESTORE: ${{ steps.restore.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          REPEAT: ${{ steps.repeat.outcome }}
          NUGET_VULN: ${{ steps.nuget_vuln.outcome }}
          NUGET_OUTDATED: ${{ steps.nuget_outdated.outcome }}
          TRIVY: ${{ steps.trivy.outcome }}
        run: |
          {
            echo
            echo "## Step outcomes"
            echo "- Restore: $RESTORE"
            echo "- Format: $FORMAT"
            echo "- Release build: $BUILD"
            echo "- Tests: $TESTS"
            echo "- Repeat tests: $REPEAT"
            echo "- NuGet vulnerabilities: $NUGET_VULN"
            echo "- NuGet outdated inventory: $NUGET_OUTDATED"
            echo "- Trivy HIGH/CRITICAL: $TRIVY"
            echo
            echo "## Repository status"
            echo '```'
            git status --short
            echo '```'
            echo
            echo "## Notes"
            echo "This workflow intentionally does not attempt GitHub Copilot/cloud-agent assignment because this repository/account rejected that assignment repeatedly."
            echo "The full audit contract remains in AUDIT_AGENT_PROMPT.md on $AUDIT_BRANCH."
          } >> audit-output/AUTOMATED_AUDIT.md
          cat audit-output/AUTOMATED_AUDIT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload overnight audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlasnoc-overnight-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 14

      - name: Final audit gate
        if: always()
        shell: bash
        env:
          RESTORE: ${{ steps.restore.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          REPEAT: ${{ steps.repeat.outcome }}
          NUGET_VULN: ${{ steps.nuget_vuln.outcome }}
          TRIVY: ${{ steps.trivy.outcome }}
        run: |
          rc=0
          for value in "$RESTORE" "$FORMAT" "$BUILD" "$TESTS" "$REPEAT" "$NUGET_VULN" "$TRIVY"; do
            if [ "$value" != "success" ]; then rc=1; fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "One or more audit gates failed. Evidence was uploaded; inspect the corresponding logs."
            exit 1
          fi
          echo "All deterministic audit gates passed."
