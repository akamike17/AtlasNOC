apiVersion: v1
kind: Namespace
metadata:
  name: atlasnoc
---
apiVersion: v1
kind: Secret
metadata:
  name: atlasnoc-secrets
  namespace: atlasnoc
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "CHANGE_ME"
  MYSQL_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
  SEQ_API_KEY: "CHANGE_ME"
  NVD_API_KEY: "CHANGE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlasnoc-config
  namespace: atlasnoc
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  AtlasNoc__RequireHttps: "true"
  AtlasNoc__ApplyMigrationsOnStartup: "true"
  Serilog__MinimumLevel__Default: "Information"
  Serilog__WriteTo__Seq__ServerUrl: "http://seq:5341"
  OpenTelemetry__Endpoint: "http://otel-collector:4317"
  CveFetcher__IntervalHours: "24"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlasnoc-api
  namespace: atlasnoc
  labels:
    app: atlasnoc-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: atlasnoc-api
  template:
    metadata:
      labels:
        app: atlasnoc-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: atlasnoc-api
        image: atlasnoc:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: atlasnoc-config
        - secretRef:
            name: atlasnoc-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: atlasnoc-api
  namespace: atlasnoc
spec:
  selector:
    app: atlasnoc-api
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlasnoc-ingress
  namespace: atlasnoc
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1s"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.your-domain.com
    secretName: atlasnoc-tls
  rules:
  - host: api.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: atlasnoc-api
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: atlasnoc
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: atlasnoc
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        envFrom:
        - secretRef:
            name: atlasnoc-secrets
        - configMapRef:
            name: mysql-config
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: mysql-config
          mountPath: /etc/mysql/conf.d
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "localhost"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "localhost"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: mysql-config
        configMap:
          name: mysql-config
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: atlasnoc
data:
  custom.cnf: |
    [mysqld]
    innodb_buffer_pool_size = 512M
    max_connections = 200
    innodb_log_file_size = 128M
    innodb_flush_log_at_trx_commit = 2
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: atlasnoc
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: atlasnoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "$(REDIS_PASSWORD)"]
        ports:
        - containerPort: 6379
        envFrom:
        - secretRef:
            name: atlasnoc-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        emptyDir: {}